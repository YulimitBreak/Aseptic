build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 60
  LargeClass:
    threshold: 600
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false # for DSL

naming:
  MatchingDeclarationName:
    active: false # is overlapping with a rule from Formatting

formatting:
  NoWildcardImports:
    active: false # is overlapping
    excludes: [ '**/test/**' ]
    excludeImports:
      - 'java.util.*'

style:
  NewLineAtEndOfFile:
    active: false # is overlapping with a rule from Formatting
  MaxLineLength:
    active: false # is overlapping with a rule from Formatting
  ModifierOrder:
    active: false # is overlapping with a rule from Formatting
  ReturnCount:
    active: false # often is necessary
  WildcardImport:
    active: false # is overlapping

empty-blocks:
  EmptyClassBlock:
    active: false # is overlapping with a rule from Formatting