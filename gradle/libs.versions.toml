[versions]
kotlin = "2.3.21"
kotlinxCoroutines = "1.11.0"
ksp = "2.3.7"
agp = "9.0.1"
detekt = "1.23.8"
kotest = "6.1.11"
kctfork = "0.12.1"

[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
detekt-formatting    = { module = "io.gitlab.arturbosch.detekt:detekt-formatting",    version.ref = "detekt" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }

# Testing
kotest-engine       = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-assertions   = { module = "io.kotest:kotest-assertions-core",  version.ref = "kotest" }
kotest-property     = { module = "io.kotest:kotest-property",         version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5",   version.ref = "kotest" }
kotlinxCoroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kctfork-core = { module = "dev.zacsweers.kctfork:core", version.ref = "kctfork" }
kctfork-ksp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }


[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
